[package]
name = "cocoadesk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
calamine = "0.30"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust-stemmers = "1"
ureq = "3"
url = "2"
